<script>
// State & Navigation
let step = 1;
const totalSteps = 5;

function goTo(n) {
  step = n;
  document.querySelectorAll(".rr-step").forEach(el => {
    el.classList.toggle("active", +el.dataset.step === n);
  });
  const pct = (n-1) / (totalSteps-1) * 100;
  document.getElementById("progressFill").style.width = pct + "%";

  if (n === 3) renderPattern();
  if (n === 4) updateNudges();
  if (n === 5) renderSegmentAndQuestions();
  window.scrollTo({top:0, behavior:"smooth"});
}

// Event Listeners for Navigation
document.getElementById("startBtn").addEventListener("click", () => goTo(2));
document.getElementById("backToStep1").addEventListener("click", () => goTo(1));
document.getElementById("showPattern").addEventListener("click", () => goTo(3));
document.getElementById("backToStep2").addEventListener("click", () => goTo(2));
document.getElementById("continueToAudience").addEventListener("click", () => goTo(4));
document.getElementById("backToStep3").addEventListener("click", () => goTo(3));
document.getElementById("shapeStarter").addEventListener("click", () => goTo(5));
document.getElementById("backToStep4").addEventListener("click", () => goTo(4));
document.getElementById("startFresh").addEventListener("click", () => {
  // Reset form
  document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
  document.querySelectorAll("textarea").forEach(ta => ta.value = "");
  document.querySelectorAll("select").forEach(s => s.selectedIndex = 0);
  goTo(1);
});

// Readiness Banner
const cap = document.getElementById("capacity");
const act = document.getElementById("activation");
const banner = document.getElementById("pauseBanner");

function checkReadiness() {
  banner.style.display = (cap.value === "low" || act.value === "high") ? "block" : "none";
}
cap.addEventListener("change", checkReadiness);
act.addEventListener("change", checkReadiness);

// Pattern Library
const patternLibrary = {
  A: {
    name: "Overcreator",
    scoreKeys: ["A1","A2","A3","A4","A5"],
    movie: [
      "You open four new tabs with course / journal / event ideas… again.",
      "You spend hours designing something beautiful no one has asked for yet.",
      "You host a workshop / live with 4–12 people and almost no one buys the next thing.",
      "You post inspirational content across 3 platforms but get mostly silence.",
      "You feel excited by new ideas… then quietly exhausted by how many are unfinished."
    ],
    mirror: {
      doing: "Creating lots of things (content, events, offers) but very little consistent money.",
      signals: "Outputs are being produced; demand is not.",
      not: "A branding problem, a posting frequency problem, or a laziness problem.",
      is: "A segmentation + clear-problem-definition problem first.",
      believe: "\"If I make more things / more beautiful things, eventually something will land.\"",
      reality: "Energy and attention are spread thin → no single group gets enough clarity to say yes."
    }
  },
  B: {
    name: "Solution-First Corporate Escapee",
    scoreKeys: ["B1","B2","B3","B4"],
    movie: [
      "You're on your fifth version of the offer page / sales video / pricing.",
      "You send thoughtful DMs or emails to lots of people → mostly polite \"looks interesting!\" replies.",
      "You attend networking events / lives and collect business cards, but few turn into clients.",
      "You keep hearing \"this sounds great\" but almost never \"I'll take it\".",
      "You quietly wonder if the market just doesn't get it yet."
    ],
    mirror: {
      doing: "Polishing one structured offer / brand for a long time before real traction.",
      signals: "Solution built before narrow segment + problem were chosen.",
      not: "A \"no market exists\" problem or a \"visibility\" problem.",
      is: "A who-is-this-for-first + where-can-I-actually-reach-them problem.",
      believe: "\"If more of the right people just saw this…\"",
      reality: "Most people don't instantly recognize themselves → so they scroll past."
    }
  },
  C: {
    name: "Validated-But-Muted Founder",
    scoreKeys: ["C1","C2","C3","C4"],
    movie: [
      "You deliver powerful 1:1 sessions / small groups → clients have breakthroughs.",
      "You avoid writing headlines / offer copy because \"nothing sounds right\".",
      "You post beautiful inspiration / behind-the-scenes… but rarely name concrete outcomes.",
      "You get lovely testimonials and DMs saying \"this is so needed\"… but few purchases.",
      "You secretly worry you're \"bad at marketing\" even though people get results."
    ],
    mirror: {
      doing: "Helped real people get results, but can't turn wins into repeatable sales.",
      signals: "Proof exists; clear, narrow, repeatable messaging & GTM motion do not (yet).",
      not: "A \"start completely over\" problem or \"your offer doesn't work\" problem.",
      is: "A positioning + client-language messaging + simple GTM motion problem.",
      believe: "\"I'm just not good at selling / marketing myself.\"",
      reality: "You have evidence it works — you just haven't translated it into words one specific group hears as \"this is for me\"."
    }
  },
  D: {
    name: "Frozen Founder",
    scoreKeys: ["D1","D2","D3","D4","D5"],
    movie: [
      "You spend hours journaling, mind-mapping, watching trainings… but rarely make offers.",
      "You rewrite your niche / ideal client / messaging doc for the 7th time.",
      "You tell trusted friends \"I know what I need to do\"… then don't do it.",
      "Early wins or clarity happened… then fear / shame / overwhelm shut everything down.",
      "The thought of posting an offer or sending a pitch makes your chest tighten."
    ],
    mirror: {
      doing: "Planning / preparing / consuming / freezing instead of shipping offers or reaching out.",
      signals: "Nervous system protection (freeze) is currently louder than strategy.",
      not: "A discipline problem, a \"you don't want it enough\" problem, or permanent failure.",
      is: "An avoidance / safety / small-step problem — often after earlier over-effort or hurt.",
      believe: "\"I need more clarity / alignment / confidence before I can act safely.\"",
      reality: "Clarity usually comes <em>after</em> tiny, safe experiments — not before."
    }
  }
};

function getTopPattern() {
  const checked = [...document.querySelectorAll("input[name='b']:checked")].map(el => el.value);
  if (checked.length === 0) return "D";

  let scores = {A:0, B:0, C:0, D:0};
  checked.forEach(v => {
    for (let pat in patternLibrary) {
      if (patternLibrary[pat].scoreKeys.includes(v)) scores[pat]++;
    }
  });

  if (checked.some(v => v.startsWith("D"))) scores.D += 1.5;

  return Object.keys(scores).reduce((a,b) => scores[a] > scores[b] ? a : b);
}

function renderPattern() {
  const pat = getTopPattern();
  const data = patternLibrary[pat];

  document.getElementById("patternCard").innerHTML = `
    <div class="rr-pattern-title">${data.name}</div>
    <p style="margin:8px 0 12px;color:#666;font-size:14px;">Most likely pattern based on what you checked</p>
  `;

  document.getElementById("movieScenes").innerHTML = data.movie
    .map(s => `<li>${s}</li>`)
    .join("");

  const m = data.mirror;
  document.getElementById("mirrorContainer").innerHTML = `
    <div class="rr-mirror-grid">
      <div class="rr-mirror-block"><strong>What you're doing:</strong> ${m.doing}</div>
      <div class="rr-mirror-block"><strong>What this signals:</strong> ${m.signals}</div>
      <div class="rr-mirror-block"><strong>What this is NOT:</strong> ${m.not}</div>
      <div class="rr-mirror-block"><strong>What this actually is:</strong> ${m.is}</div>
      <div class="rr-mirror-block"><strong>What you probably believe:</strong> ${m.believe}</div>
      <div class="rr-mirror-block"><strong>What's more likely happening:</strong> ${m.reality}</div>
    </div>
  `;
}

// Step 4 Nudges
function updateNudges() {
  const pat = getTopPattern();
  const dayNudge = document.getElementById("dayNudge");
  
  const nudges = {
    A: "Pick one moment / one group for now — even if your brain offers five.",
    B: "Think of a role / team / community you already have some access to.",
    C: "Picture one real past client who got the best result — use them as the main character.",
    D: "Start with a small, safe, reachable group — perfection is not required."
  };
  
  dayNudge.textContent = nudges[pat];
}

// Step 5 Segment & Questions
const nextQuestionsLibrary = {
  A: [
    "What are 2–3 real situations where people in this group are already asking for help (Reddit, FB groups, forums, colleagues)?",
    "Which of my existing ideas/products am I willing to pause so I can focus on one clear problem?",
    "Who is the mostthe real, raw, close-at-hand connection eager to be seen version of this group right now?"
  ],
  B: [
    "Which specific roles / teams / companies do I already have the easiest access to?",
    "What’s the main thing they’re trying to make happen at work right now",
    "Where do these people already gather, and how could I listen before pitching?"
  ],
  C: [
    "What exact words did my best clients use when describing their problem before working with me?",
    "Which of my past wins came from the narrowest, most specific group of people I'm aiming at?",
    "What's the simplest version of my offer I could describe in one sentence to that exact group?"
  ],
  D: [
    "What's the smallest possible offer I could make in the next 7 days without needing more prep?",
    "Who could I ask for help / accountability in taking one tiny public action?",
    "What would feel 10% safer than what I'm avoiding right now?"
  ]
};

function renderSegmentAndQuestions() {
  const pat = getTopPattern();
  const questions = nextQuestionsLibrary[pat];
  
  document.getElementById("segmentNudge").textContent = 
    "Be specific about the WHO, the PROBLEM, and the OUTCOME. Vague = invisible.";
  
  document.getElementById("nextQuestions").innerHTML = `
    <h4>Based on your ${patternLibrary[pat].name} pattern:</h4>
    <ul>${questions.map(q => `<li>${q}</li>`).join("")}</ul>
  `;
}
</script>
